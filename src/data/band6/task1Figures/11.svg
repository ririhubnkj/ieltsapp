<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d3b"/></marker></defs><rect width="640" height="470" fill="#fff"/><text x="320.0" y="28.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2430">How bees produce honey</text><rect x="16" y="48" width="608" height="150" rx="12" fill="#eef6e8" stroke="#a9c99a" stroke-dasharray="6 4"/><text x="30.0" y="70.0" font-size="12" text-anchor="start" font-weight="bold" fill="#4f7d3f">OUTSIDE THE HIVE</text><rect x="16" y="222" width="608" height="232" rx="12" fill="#fff4dc" stroke="#e0b866" stroke-dasharray="6 4"/><text x="610.0" y="244.0" font-size="12" text-anchor="end" font-weight="bold" fill="#a87a1c">INSIDE THE HIVE</text><rect x="40" y="86" width="160" height="92" rx="10" fill="#fff" stroke="#5fa052" stroke-width="2.5"/><circle cx="58" cy="104" r="11" fill="#5fa052"/><text x="58.0" y="108.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">1</text><text x="126.0" y="128.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Worker bees</text><text x="126.0" y="143.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">leave the hive</text><line x1="202" y1="132" x2="236" y2="132" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="240" y="86" width="160" height="92" rx="10" fill="#fff" stroke="#5fa052" stroke-width="2.5"/><circle cx="258" cy="104" r="11" fill="#5fa052"/><text x="258.0" y="108.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">2</text><text x="326.0" y="121.5" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Bees collect</text><text x="326.0" y="136.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">nectar</text><text x="326.0" y="150.5" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">from flowers</text><line x1="402" y1="132" x2="436" y2="132" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="86" width="160" height="92" rx="10" fill="#fff" stroke="#5fa052" stroke-width="2.5"/><circle cx="458" cy="104" r="11" fill="#5fa052"/><text x="458.0" y="108.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">3</text><text x="526.0" y="121.5" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Bees carry</text><text x="526.0" y="136.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">nectar back in</text><text x="526.0" y="150.5" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">a honey stomach</text><path d="M520,180 L520,210 L120,210 L120,262" fill="none" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="264" width="160" height="74" rx="10" fill="#fff" stroke="#d9a531" stroke-width="2.5"/><circle cx="58" cy="282" r="11" fill="#d9a531"/><text x="58.0" y="286.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">4</text><text x="126.0" y="297.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Nectar is passed</text><text x="126.0" y="312.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">to house bees</text><line x1="202" y1="301" x2="236" y2="301" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="240" y="264" width="160" height="74" rx="10" fill="#fff" stroke="#d9a531" stroke-width="2.5"/><circle cx="258" cy="282" r="11" fill="#d9a531"/><text x="258.0" y="286.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">5</text><text x="326.0" y="297.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Nectar is put</text><text x="326.0" y="312.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">into cells</text><line x1="402" y1="301" x2="436" y2="301" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="264" width="160" height="74" rx="10" fill="#fff" stroke="#d9a531" stroke-width="2.5"/><circle cx="458" cy="282" r="11" fill="#d9a531"/><text x="458.0" y="286.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">6</text><text x="526.0" y="297.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Bees fan</text><text x="526.0" y="312.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">their wings</text><line x1="520" y1="340" x2="520" y2="362" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="366" width="160" height="74" rx="10" fill="#fff" stroke="#d9a531" stroke-width="2.5"/><circle cx="458" cy="384" r="11" fill="#d9a531"/><text x="458.0" y="388.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">7</text><text x="526.0" y="399.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Water evaporates;</text><text x="526.0" y="414.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">nectar thickens</text><line x1="438" y1="403" x2="404" y2="403" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><rect x="240" y="366" width="160" height="74" rx="10" fill="#f3c24b" stroke="#b8860b" stroke-width="2.5"/><circle cx="258" cy="384" r="11" fill="#b8860b"/><text x="258.0" y="388.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#fff">8</text><text x="326.0" y="399.8" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">Cells are sealed</text><text x="326.0" y="414.2" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1c2430">with wax</text><line x1="238" y1="403" x2="196" y2="403" stroke="#8a6d3b" stroke-width="3" marker-end="url(#ah)"/><polygon points="186.4,382.0 186.4,424.0 150.0,445.0 113.6,424.0 113.6,382.0 150.0,361.0" fill="#f3c24b" stroke="#b8860b" stroke-width="3"/><text x="150.0" y="408.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2430">Honey</text></svg>
